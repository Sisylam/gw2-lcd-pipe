name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MinGW (gcc) and cppcheck
        run: choco install mingw cppcheck --no-progress -y

      - name: Add Rust linter components
        run: rustup component add clippy rustfmt

      - name: Build replacement server
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File lcdproxy\build-server.ps1 -Out lgpipe_server4.exe

      - name: Tests
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\test.ps1

      - name: Lint
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\lint.ps1
