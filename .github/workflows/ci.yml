name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MinGW (gcc)
        run: choco install mingw --no-progress -y

      # Pin cppcheck: the bundled/winlibs one is broken and choco lags behind.
      - name: Install cppcheck 2.22.0 (pinned)
        shell: pwsh
        run: |
          $msi = "$env:TEMP\cppcheck.msi"
          Invoke-WebRequest 'https://github.com/danmar/cppcheck/releases/download/2.22.0/cppcheck-2.22.0-x64-Setup.msi' -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait

      - name: Add Rust linter components
        run: rustup component add clippy rustfmt

      - name: Build replacement server
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File lcdproxy\build-server.ps1 -Out lgpipe_server4.exe

      - name: Tests
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\test.ps1

      - name: Lint
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\lint.ps1
